<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LuxBid</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body style="font-family:Arial;text-align:center;padding-top:60px;">

  <h1>LuxBid</h1>

  <button id="loginBtn">Login with Pi</button>

  <br><br>

  <button id="payBtn">Pay 1 Pi</button>

  <script>

    window.onload = function () {

      Pi.init({
        version: "2.0",
        sandbox: true
      });

      document.getElementById("loginBtn").addEventListener("click", async function () {

        try {

          const scopes = ['payments', 'username'];

          const auth = await Pi.authenticate(scopes, function(payment) {
            console.log(payment);
          });

          alert("Welcome " + auth.user.username);

        } catch (e) {

          alert("Login Failed");

          console.log(e);

        }

      });

      document.getElementById("payBtn").addEventListener("click", async function () {

        try {

          await Pi.createPayment({

            amount: 1,
            memo: "LuxBid Test Payment",
            metadata: { product: "LuxBid" }

          }, {

            onReadyForServerApproval: function(paymentId) {
              console.log(paymentId);
            },

            onReadyForServerCompletion: function(paymentId, txid) {
              console.log(paymentId, txid);
            },

            onCancel: function(paymentId) {
              console.log(paymentId);
            },

            onError: function(error) {
              console.log(error);
            }

          });

        } catch (e) {

          alert("Payment Failed");

          console.log(e);

        }

      });

    };

  </script>

</body>

</html>
